[phases.setup]
nixPkgs = ['php83', 'php83Packages.composer']

[phases.build]
cmds = ['composer install --no-dev --optimize-autoloader --ignore-platform-reqs']

[start]
cmd = '(php artisan key:generate --force || true) && (php artisan migrate --force || true) && (php artisan db:seed --force || true) && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT'
