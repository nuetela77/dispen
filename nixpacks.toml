[phases.setup]
nixPkgs = ['php84', 'php84Packages.composer', 'php84Extensions.pdo_mysql', 'php84Extensions.gd', 'php84Extensions.zip', 'php84Extensions.bcmath']

[phases.build]
cmds = ['composer install --no-dev --optimize-autoloader --ignore-platform-reqs']

[start]
cmd = 'sh -c "php artisan config:clear && php artisan storage:link && (php artisan migrate --force || true) && (php artisan db:seed --force || true) && php artisan serve --host=0.0.0.0 --port=$PORT"'
