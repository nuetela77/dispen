<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Uji Coba - Sistem Izin Digital SMKN 1 Jakarta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body {
            background: #090e1a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .access-card {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 36px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .qr-box {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            margin: 20px 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .qr-img { width: 220px; height: 220px; display: block; }
        .url-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 14px;
            font-family: monospace;
            font-size: 13px;
            color: #60a5fa;
            word-break: break-all;
            margin-bottom: 20px;
        }
        .btn-open {
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            transition: all 0.15s ease;
        }
        .btn-open:hover { background: #1d4ed8; color: #fff; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="access-card">
        <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #3b82f6; margin-bottom: 4px;">
            SMK Negeri 1 Jakarta
        </div>
        <h4 style="font-weight: 700; margin-bottom: 6px;">Akses Cloud Uji Coba</h4>
        <p style="font-size: 13px; color: #94a3b8; margin: 0;">
            Scan QR Code menggunakan kamera HP atau klik link di bawah untuk langsung membuka web:
        </p>

        <div class="qr-box">
            <img src="/qr-akses.png" alt="Scan QR Code" class="qr-img">
        </div>

        <div class="url-box">
            https://ulvis.net/suratizinsmk1
        </div>

        <a href="https://ulvis.net/suratizinsmk1" target="_blank" class="btn-open">
            <i class="bi bi-box-arrow-up-right me-2"></i> Buka Website Langsung
        </a>

        <div style="margin-top: 20px; font-size: 12px; color: #64748b; line-height: 1.5;">
            <i class="bi bi-shield-check text-success me-1"></i> Langsung terbuka tanpa layar konfirmasi IP.<br>
            Kamera selfie verifikasi otomatis aktif via HTTPS.
        </div>
    </div>
</body>
</html>
